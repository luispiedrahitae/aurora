build:
  maxIssues: 0
  excludeCorrectable: false

complexity:
  LongMethod:
    threshold: 80
  LongParameterList:
    functionThreshold: 8
    constructorThreshold: 8
  CyclomaticComplexMethod:
    threshold: 20
  TooManyFunctions:
    thresholdInClasses: 25
    thresholdInFiles: 25

style:
  MagicNumber:
    # Los source sets KMP (commonTest, desktopTest) no caen en los excludes por defecto de Detekt.
    excludes: ['**/commonTest/**', '**/desktopTest/**']
    ignoreNumbers: ['-1', '0', '1', '2', '10', '100', '1000']
    ignoreEnums: true
    ignoreRanges: true
  # El formato (incluido el largo de línea) lo gobierna Spotless + ktlint, no Detekt.
  MaxLineLength:
    active: false
  ReturnCount:
    max: 4
  ForbiddenComment:
    active: false
  UnusedPrivateMember:
    active: true

naming:
  FunctionNaming:
    # PascalCase permitido (Composables); además ignora funciones @Composable explícitamente.
    functionPattern: '[a-zA-Z][a-zA-Z0-9]*'
    ignoreAnnotated: ['Composable']
