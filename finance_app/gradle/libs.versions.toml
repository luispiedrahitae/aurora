[versions]
kotlin = "2.4.21"
agp = "8.13.2"
compose-mp = "1.11.1"
compose-material3 = "1.9.0"
# Última versión publicada del catálogo de iconos; JetBrains dejó de versionarlo con Compose.
compose-material-icons = "1.7.3"
sqldelight = "2.4.1"
coroutines = "1.11.0"
serialization = "1.13.0"
datetime = "0.8.0"
koin = "4.2.2"
lifecycle = "2.10.0"
nav = "2.9.2"
work = "2.12.0"
biometric = "1.1.0"
activity = "1.12.4"
detekt = "1.23.8"
spotless = "8.11.0"
ktlint = "1.8.0"

[libraries]
kotlinx-coroutines-core    = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test    = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-coroutines-swing   = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-swing", version.ref = "coroutines" }
kotlinx-datetime           = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "datetime" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }

compose-runtime               = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "compose-mp" }
compose-foundation            = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "compose-mp" }
compose-material3             = { module = "org.jetbrains.compose.material3:material3", version.ref = "compose-material3" }
compose-material-icons-extended = { module = "org.jetbrains.compose.material:material-icons-extended", version.ref = "compose-material-icons" }
compose-components-resources  = { module = "org.jetbrains.compose.components:components-resources", version.ref = "compose-mp" }

sqldelight-runtime         = { module = "app.cash.sqldelight:runtime", version.ref = "sqldelight" }
sqldelight-coroutines-ext  = { module = "app.cash.sqldelight:coroutines-extensions", version.ref = "sqldelight" }
sqldelight-driver-android  = { module = "app.cash.sqldelight:android-driver", version.ref = "sqldelight" }
sqldelight-driver-native   = { module = "app.cash.sqldelight:native-driver", version.ref = "sqldelight" }
sqldelight-driver-sqlite   = { module = "app.cash.sqldelight:sqlite-driver", version.ref = "sqldelight" }

koin-core              = { module = "io.insert-koin:koin-core",              version.ref = "koin" }
koin-compose           = { module = "io.insert-koin:koin-compose",           version.ref = "koin" }
koin-compose-viewmodel = { module = "io.insert-koin:koin-compose-viewmodel", version.ref = "koin" }
koin-android           = { module = "io.insert-koin:koin-android",           version.ref = "koin" }

androidx-lifecycle-viewmodel = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-navigation-compose  = { module = "org.jetbrains.androidx.navigation:navigation-compose", version.ref = "nav" }
androidx-activity-compose    = { module = "androidx.activity:activity-compose", version.ref = "activity" }
androidx-work-runtime        = { module = "androidx.work:work-runtime-ktx", version.ref = "work" }
androidx-biometric           = { module = "androidx.biometric:biometric", version.ref = "biometric" }


[plugins]
kotlinMultiplatform  = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlinAndroid        = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlinJvm            = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlinSerialization  = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
composeCompiler      = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
androidApplication   = { id = "com.android.application", version.ref = "agp" }
androidLibrary       = { id = "com.android.library", version.ref = "agp" }
composeMultiplatform = { id = "org.jetbrains.compose", version.ref = "compose-mp" }
sqldelight           = { id = "app.cash.sqldelight", version.ref = "sqldelight" }
detekt               = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
spotless             = { id = "com.diffplug.spotless", version.ref = "spotless" }
