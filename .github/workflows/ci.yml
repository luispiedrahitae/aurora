name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality (Spotless + Detekt + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: finance_app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew checkQuality --stacktrace

  android:
    name: Android (assemble debug + bundle release)
    runs-on: ubuntu-latest
    needs: quality
    defaults:
      run:
        working-directory: finance_app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :androidApp:assembleDebug :androidApp:bundleRelease --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: finance_app/androidApp/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-release-aab
          path: finance_app/androidApp/build/outputs/bundle/release/*.aab

  desktop-preview:
    name: Desktop preview (Windows)
    runs-on: windows-latest
    needs: quality
    defaults:
      run:
        working-directory: finance_app
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :desktopApp:packageDistributionForCurrentOS --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-windows-installer
          path: finance_app/desktopApp/build/compose/binaries/main/**/*.msi

  ios:
    name: iOS (build sin firmar)
    runs-on: macos-14
    needs: quality
    defaults:
      run:
        working-directory: finance_app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build shared framework
        run: ./gradlew :shared:linkReleaseFrameworkIosArm64 --stacktrace
      - name: Build iOS app
        if: hashFiles('iosApp/iosApp.xcodeproj/project.pbxproj') != ''
        run: |
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            build
